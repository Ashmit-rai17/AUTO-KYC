services:
  db:
    image: postgres:16-alpine
    container_name: kycflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kycflow
      POSTGRES_PASSWORD: kycflow
      POSTGRES_DB: kycflow
    ports:
      - "5432:5432"
    volumes:
      - kycflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kycflow -d kycflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kycflow-db-data:
